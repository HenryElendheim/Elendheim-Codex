name: Release

# Builds the app and publishes a GitHub Release with the installable APK attached.
# Runs when triggered by hand from the Actions tab, or when a version tag is pushed.
# The runner has write access, so it can create the release and upload the file.
on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make the wrapper runnable
        run: chmod +x ./gradlew

      - name: Build the debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Work out the version and release notes
        id: meta
        run: |
          # Read the friendly version name straight from the build file. Match only the
          # assignment, for example versionName = "1.1", not the nearby comment line.
          VERSION=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Pull the notes for the newest version, the first block in RELEASES.md.
          awk '/^## /{c++} c==1{print} c==2{exit}' RELEASES.md > release_notes.md
          # Give the APK a clear, versioned name.
          cp app/build/outputs/apk/debug/app-debug.apk "elendheim-codex-v${VERSION}.apk"

      - name: Publish the release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: Elendheim Codex v${{ steps.meta.outputs.version }}
          body_path: release_notes.md
          files: elendheim-codex-v${{ steps.meta.outputs.version }}.apk
          fail_on_unmatched_files: true
