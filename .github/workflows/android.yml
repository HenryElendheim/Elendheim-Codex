name: Android build

# Build and unit test the app on every push and pull request to the main branches.
# GitHub hosted runners already have the Android SDK, so this checks that the whole
# project compiles, not just the pure logic.
on:
  push:
    branches: [ main, testing ]
  pull_request:
    branches: [ main, testing ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Make the wrapper runnable
        run: chmod +x ./gradlew

      - name: Run the unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build the debug APK
        run: ./gradlew assembleDebug --stacktrace
